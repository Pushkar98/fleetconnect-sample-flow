# FleetConnect — local platform
# Start:  docker compose up -d        Stop: docker compose down
# Budget: ~4 GB Docker RAM, so every JVM has an explicit heap cap.
#
# Network: all containers share the default compose network and talk to each other
# by service name (kafka:9092, postgis:5432, ...). Ports listed under `ports:` are
# the ones exposed to your laptop (localhost).

name: fleetconnect

services:

  # ---------------------------------------------------------------------------
  # Kafka — the event backbone. KRaft mode = no ZooKeeper; this single node is
  # both "controller" (cluster metadata) and "broker" (stores messages).
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: fc-kafka
    ports:
      - "9094:9094"          # EXTERNAL listener for tools running on your laptop
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners: INTERNAL for containers, EXTERNAL for localhost.
      # A client is told to reconnect to the "advertised" address, which is why
      # containers must use kafka:9092 and your laptop must use localhost:9094.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Any 16-byte base64url id; fixed so the data volume survives restarts.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      # Single node => replication factor 1 for internal topics.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Governance: topics are created deliberately (as code), never by accident
      # from a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Store messages on the named volume (default is /tmp, lost on recreate).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 768m

  # ---------------------------------------------------------------------------
  # Schema Registry — stores Avro schemas (the "data contracts") and refuses
  # new versions that break compatibility rules. It keeps its own state in a
  # Kafka topic called _schemas.
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: fc-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SCHEMA_REGISTRY_HOST_PORT:-8085}:8081"   # 8081 inside the network, 8085 on your laptop
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # Platform standard (see CLAUDE.md): consumers on the new schema must be
      # able to read data written with the previous schema.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # Kafka UI — a browser window into topics, messages, consumer groups and
  # registered schemas. Our stand-in for enterprise Kafka observability.
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: fc-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fleetconnect-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      JAVA_OPTS: "-Xms128m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # PostGIS — PostgreSQL + spatial types/indexes/functions. Local stand-in for
  # Snowflake (which also has GEOGRAPHY types and H3 functions).
  # imresamu/postgis is the multi-arch build of the official postgis image
  # (the official one is amd64-only and would run emulated on Apple Silicon).
  # ---------------------------------------------------------------------------
  postgis:
    image: imresamu/postgis:16-3.4
    container_name: fc-postgis
    ports:
      - "${POSTGIS_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetconnect}
      POSTGRES_DB: ${POSTGRES_DB:-fleetconnect}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      # SQL files here run once, on first start with an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # n8n — workflow automation (self-hosted, free). Used for the consumer
  # consent workflow in Phase 6. First visit asks you to create a local owner
  # account; it is stored only in the n8n_data volume on your machine.
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:1.64.0
    container_name: fc-n8n
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"     # we serve over plain http on localhost
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/workflows   # exported workflow JSON lives in the repo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m

  # ---------------------------------------------------------------------------
  # api — FastAPI Location API + the web map (static files in /web) + the mock
  # AI agent endpoint. Every channel reaches data through here.
  # ---------------------------------------------------------------------------
  api:
    build: .
    image: fleetconnect-python:local
    container_name: fc-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgis:
        condition: service_healthy
    mem_limit: 384m

  # ---------------------------------------------------------------------------
  # sink — consumes the Kafka topics and upserts into PostGIS (runs forever).
  # ---------------------------------------------------------------------------
  sink:
    image: fleetconnect-python:local
    container_name: fc-sink
    command: python pipeline/03_sink_to_postgis.py
    volumes:
      - .:/workspace
    depends_on:
      api:
        condition: service_started   # ensures the shared image is built first
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

volumes:
  kafka_data:
  postgis_data:
  n8n_data:
